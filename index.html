<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a4d">
<title>Pikmin Bloom Decor Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231f7a4d'/%3E%3Cpath d='M32 14c6 6 6 14 0 20-6-6-6-14 0-20z' fill='%23fff'/%3E%3Cpath d='M32 34v16' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --green:#1f7a4d;--green-2:#16a34a;--ink:#16211b;--muted:#5d6b63;--line:#dfe5e1;--bg:#fff;--chip:#f1f5f2;
  --yellow:#eab308;--orange:#f97316;--red:#ef4444;--blue:#2563eb;
  --sheet-h:42vh;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#e9ecef;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#map{position:fixed;inset:0}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:8px 14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
#top{position:fixed;left:10px;right:10px;top:calc(10px + var(--safe-t));display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#pick{font-weight:650;border:2px solid var(--green);max-width:100%;overflow:hidden;text-overflow:ellipsis}
#pick .ico{font-size:20px}
#status{font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis}
#status.busy::before{content:"";width:12px;height:12px;border:2px solid var(--green);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;flex:none}
#status.warn{color:#9a3412;border-color:#fdba74}
@keyframes spin{to{transform:rotate(360deg)}}
#fabs{position:fixed;right:10px;bottom:calc(var(--sheet-h) + 14px);display:flex;flex-direction:column;gap:8px;z-index:5;transition:bottom .2s}
.fab{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:19px;display:grid;place-items:center}
.fab.on{background:var(--green);color:#fff;border-color:var(--green)}
#legend{position:fixed;left:10px;bottom:calc(var(--sheet-h) + 14px);z-index:5;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 80px);transition:bottom .2s}
#legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#legend[hidden],#status[hidden]{display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet-h);background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.14);z-index:6;display:flex;flex-direction:column;transition:height .2s;padding-bottom:var(--safe-b)}
#grab{height:22px;display:grid;place-items:center;cursor:ns-resize;touch-action:none;flex:none}
#grab::before{content:"";width:42px;height:5px;border-radius:3px;background:#c8d0cb}
#tabs{display:flex;gap:4px;padding:0 10px 6px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
#tabs button{border:0;background:none;padding:7px 10px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap}
#tabs button.on{background:var(--chip);color:var(--green)}
.panel{flex:1;overflow:auto;padding:10px 14px 18px;display:none;-webkit-overflow-scrolling:touch}
.panel.on{display:block}
.panel h3{margin:6px 0 8px;font-size:15px}
.muted{color:var(--muted);font-size:13px}
.small{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5}
.card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
.card.pure{border-color:#86efac;background:#f0fdf4}
.spot-h{display:flex;gap:8px;align-items:center;font-weight:650}
.num{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.num.l1{background:var(--yellow);color:#422006}.num.l2{background:var(--orange)}.num.l3{background:var(--red)}
.icons{font-size:18px;letter-spacing:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 10px;font-size:13px;display:inline-flex;gap:5px;align-items:center}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.target{outline:2px solid var(--green);outline-offset:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px}
.kv label{font-weight:600}
.kv select,.kv input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700}
.badge.ok{background:#dcfce7;color:#166534}.badge.no{background:#fef3c7;color:#92400e}
#picker{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none;align-items:flex-end;justify-content:center}
#picker.on{display:flex}
#picker .box{background:#fff;width:min(560px,100%);max-height:86vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
#picker header{padding:12px 14px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
#picker header input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
#pickList{overflow:auto;padding:6px 8px 14px}
.pi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 8px;border-radius:10px;text-align:left;font-size:15px}
.pi:hover,.pi.on{background:var(--chip)}
.pi .ico{font-size:22px;width:28px;text-align:center}
.pi .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.pi .cnt b{color:var(--green)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));background:#16211b;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:.95}
.detlist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.dt{display:flex;flex-direction:column;align-items:center;width:62px;font-size:11px;text-align:center;gap:2px}
.dt span:first-child{font-size:26px;width:46px;height:46px;border-radius:50%;background:var(--chip);display:grid;place-items:center;border:2px solid transparent}
.dt.t span:first-child{border-color:var(--green);background:#dcfce7}
.dt.hid{opacity:.45}
details summary{cursor:pointer;font-weight:600;margin:8px 0}
a{color:var(--green)}
@media (min-width:900px){
  #sheet{left:12px;top:calc(64px + var(--safe-t));bottom:12px;right:auto;width:400px;height:auto!important;border-radius:16px}
  #grab{display:none}
  #fabs,#legend{bottom:16px!important}
  #legend{left:424px}
  #top{left:12px}
}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <button id="pick" class="pill"><span class="ico">🎯</span><span id="pickLabel">Choose a decor type</span> ▾</button>
  <div id="status" class="pill" hidden></div>
</div>
<div id="fabs">
  <button class="fab" id="btnLocate" title="Go to my location" aria-label="My location">◎</button>
  <button class="fab" id="btnLive" title="Live detector: follow my GPS" aria-label="Live detector">📡</button>
  <button class="fab" id="btnCells" title="Show cells" aria-label="Toggle cells">▦</button>
  <button class="fab" id="btnHeat" title="Show isolation heatmap" aria-label="Toggle heatmap">◐</button>
</div>
<div id="legend"></div>
<section id="sheet">
  <div id="grab" title="Drag to resize"></div>
  <nav id="tabs">
    <button data-tab="spots" class="on">Spots</button>
    <button data-tab="detector">Detector</button>
    <button data-tab="calibrate">Calibrate</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="help">Help</button>
  </nav>
  <div class="panel on" id="p-spots"></div>
  <div class="panel" id="p-detector"></div>
  <div class="panel" id="p-calibrate"></div>
  <div class="panel" id="p-settings"></div>
  <div class="panel" id="p-help"></div>
</section>
<div id="picker"><div class="box">
  <header><input id="pickSearch" placeholder="Search decor types…" autocomplete="off"><button class="btn" id="pickClose">Close</button></header>
  <div id="pickList"></div>
</div></div>
<div id="toast"></div>
<script>
/* Pikmin Bloom Decor Finder — engine (pure logic, no DOM).
 * Works in the browser (window.PBEngine) and in Node (module.exports) for tests.
 */
(function (root) {
  'use strict';

  const ENGINE_VERSION = '1.0.0';
  const DEG = Math.PI / 180;
  const R_EARTH = 6371008.8;
  const M_PER_DEG_LAT = R_EARTH * DEG; // ~111195 m

  // ---------------------------------------------------------------------------
  // Decor categories → OSM tags  (source: Pikipedia "Decor Pikmin", Nov 2026)
  //   kind 'point' : the POI marks the single cell it sits in
  //   kind 'area'  : a polygon marks every cell it covers (rule set in options)
  //   kind 'line'  : a line marks every cell it passes through (bridges)
  // Edit this table if the community finds new/changed tags.
  // ---------------------------------------------------------------------------
  function cat(id, name, icon, kind, tags, extra) {
    return Object.assign({
      id, name, icon, kind,
      tags: (tags || []).map((s) => s.split('=')),
      cuisine: [],
    }, extra || {});
  }

  const CATEGORIES = [
    cat('restaurant', 'Restaurant', '🍽️', 'point', ['amenity=restaurant'], { generic: true }),
    cat('cafe', 'Café', '☕', 'point', ['amenity=cafe']),
    cat('sweetshop', 'Sweetshop', '🍩', 'point', ['shop=pastry']),
    cat('cinema', 'Movie Theater', '🍿', 'point', ['amenity=cinema']),
    cat('pharmacy', 'Pharmacy', '🪥', 'point', ['amenity=pharmacy']),
    cat('zoo', 'Zoo', '🦁', 'area', ['tourism=zoo']),
    cat('forest', 'Forest', '🌰', 'area', ['natural=wood', 'landuse=forest']),
    cat('waterside', 'Waterside', '🎣', 'area', ['natural=water']),
    cat('post_office', 'Post Office', '✉️', 'point', ['amenity=post_office']),
    cat('art', 'Art Gallery', '🖼️', 'point', ['shop=art']),
    cat('airport', 'Airport', '✈️', 'area', ['aeroway=aerodrome']),
    cat('station', 'Station', '🚆', 'point', ['railway=station', 'building=train_station']),
    cat('beach', 'Beach', '🐚', 'area', ['natural=beach']),
    cat('burger', 'Burger Place', '🍔', 'point', ['amenity=fast_food'], { generic: true }),
    cat('corner_store', 'Corner Store', '🏪', 'point', ['shop=convenience']),
    cat('supermarket', 'Supermarket', '🍌', 'point', ['shop=supermarket']),
    cat('bakery', 'Bakery', '🥖', 'point', ['shop=bakery']),
    cat('hair_salon', 'Hair Salon', '✂️', 'point', ['shop=hairdresser']),
    cat('clothes', 'Clothes Store', '👕', 'point', ['shop=clothes', 'shop=shoes']),
    cat('park', 'Park', '🍀', 'area', ['leisure=park']),
    cat('library', 'Library & Bookstore', '📚', 'point', ['amenity=library', 'shop=books']),
    cat('sushi', 'Sushi Restaurant', '🍣', 'point', [], { cuisine: ['sushi'] }),
    cat('mountain', 'Mountain', '⛰️', 'point', ['natural=peak']),
    cat('stadium', 'Stadium', '⚽', 'area', ['leisure=stadium']),
    cat('theme_park', 'Theme Park', '🎡', 'area', ['tourism=theme_park']),
    cat('bus_stop', 'Bus Stop', '🚌', 'point', ['highway=bus_stop']),
    cat('italian', 'Italian Restaurant', '🍕', 'point', [], { cuisine: ['pizza', 'mediterranean', 'italian'] }),
    cat('ramen', 'Ramen Restaurant', '🍜', 'point', [], { cuisine: ['chinese', 'noodle', 'ramen', 'udon', 'soba'] }),
    cat('bridge', 'Bridge', '🌉', 'line', ['bridge=yes']),
    cat('hotel', 'Hotel', '🏨', 'point', ['tourism=hotel']),
    cat('makeup', 'Makeup Store', '💄', 'point', ['shop=department_store']),
    cat('shrine', 'Shrine & Temple (Japan)', '⛩️', 'point', ['amenity=place_of_worship'], { region: 'JP' }),
    cat('appliances', 'Appliances Store', '🔋', 'point', ['shop=appliance', 'shop=computer', 'shop=electronics']),
    cat('curry', 'Curry Restaurant', '🍛', 'point', [], { cuisine: ['curry', 'indian', 'sri_lankan'] }),
    cat('diy', 'DIY Store', '🔧', 'point', ['shop=doityourself', 'shop=hardware']),
    cat('university', 'University & College', '🎓', 'area', ['amenity=university', 'amenity=college']),
    cat('mexican', 'Mexican Restaurant', '🌮', 'point', [], { cuisine: ['mexican'] }),
    cat('laundry', 'Laundromat', '🧺', 'point', ['shop=laundry', 'shop=dry_cleaning']),
    cat('korean', 'Korean Restaurant', '🥬', 'point', [], { cuisine: ['korean'] }),
    cat('stationery', 'Stationery Store', '✏️', 'point', ['shop=stationery', 'shop=craft']),
  ];
  const CAT = Object.fromEntries(CATEGORIES.map((c) => [c.id, c]));
  CATEGORIES.forEach((c, i) => {
    c.index = i;
    c.hue = Math.round((i * 137.508) % 360); // golden-angle hues: distinct colours
  });
  const ROADSIDE = { id: 'roadside', name: 'Roadside', icon: '🏷️' };

  const DEFAULT_OPTS = {
    grid: 's2-17',        // cell model: s2-16 | s2-17 | s2-18 | ll-0.00036 | ll-0.00072
    radius: 100,          // detector range in metres
    areaRule: 'center',   // 'center' = cell centre inside polygon, 'overlap' = any part touches
    cuisineMode: 'both',  // 'both' = sushi place also counts as Restaurant; 'specific' = cuisine wins
    bridgeMode: 'named',  // 'named' | 'all' | 'off'
    maxShown: 6,          // detector shows at most this many types (nearest first)
  };

  // ---------------------------------------------------------------------------
  // Small geo helpers (local equirectangular — accurate to <0.1% over a few km)
  // ---------------------------------------------------------------------------
  function distM(lat1, lon1, lat2, lon2) {
    const dy = (lat2 - lat1) * M_PER_DEG_LAT;
    const dx = (lon2 - lon1) * M_PER_DEG_LAT * Math.cos(((lat1 + lat2) / 2) * DEG);
    return Math.sqrt(dx * dx + dy * dy);
  }
  function mPerDegLon(lat) { return M_PER_DEG_LAT * Math.cos(lat * DEG); }
  function expandBBox(b, meters) {
    const dLat = meters / M_PER_DEG_LAT;
    const dLon = meters / mPerDegLon((b.s + b.n) / 2);
    return { s: b.s - dLat, w: b.w - dLon, n: b.n + dLat, e: b.e + dLon };
  }
  function bboxContains(b, lat, lon) { return lat >= b.s && lat <= b.n && lon >= b.w && lon <= b.e; }
  function bboxOverlap(a, b) { return a.s <= b.n && a.n >= b.s && a.w <= b.e && a.e >= b.w; }

  function inJapan(lat, lon) {
    if (lat >= 24 && lat < 30 && lon >= 122.9 && lon <= 131.5) return true;   // Ryukyu
    if (lat >= 30 && lat < 34.75 && lon >= 128.5 && lon <= 132.2) return true; // Kyushu, Tsushima, Goto
    if (lat >= 33.2 && lat <= 45.6 && lon >= 130.8 && lon <= 146.0) {          // Honshu–Hokkaido
      if (lat > 42.3 && lon < 139.3) return false;                            // exclude Primorye
      return true;
    }
    return false;
  }

  // ---------------------------------------------------------------------------
  // Tag → category matching
  // ---------------------------------------------------------------------------
  function cuisineList(tags) {
    const c = tags.cuisine;
    if (!c) return [];
    return String(c).toLowerCase().split(/[;,]/).map((s) => s.trim()).filter(Boolean);
  }
  function catMatches(c, tags, cuis) {
    for (const [k, v] of c.tags) if (tags[k] === v) return true;
    if (c.cuisine.length && cuis.length) for (const v of c.cuisine) if (cuis.includes(v)) return true;
    return false;
  }
  /** role: 'point' | 'area' | 'line'; elType: 'node'|'way'|'relation' */
  function catsFor(tags, elType, role, opts, lat, lon) {
    if (!tags) return [];
    const cuis = cuisineList(tags);
    const out = [];
    for (const c of CATEGORIES) {
      if (role === 'point' && !(c.kind === 'point' || (c.kind === 'area' && elType === 'node'))) continue;
      if (role === 'area' && c.kind !== 'area') continue;
      if (role === 'line' && c.kind !== 'line') continue;
      if (c.region === 'JP' && !inJapan(lat, lon)) continue;
      if (c.id === 'bridge') {
        if (opts.bridgeMode === 'off') continue;
        if (opts.bridgeMode === 'named' && !(tags.name || tags['bridge:name'])) continue;
      }
      if (catMatches(c, tags, cuis)) out.push(c.id);
    }
    if (opts.cuisineMode === 'specific' && out.some((id) => CAT[id].cuisine.length)) {
      return out.filter((id) => !CAT[id].generic);
    }
    return out;
  }

  // ---------------------------------------------------------------------------
  // Cell grids
  // ---------------------------------------------------------------------------
  // S2 (Google's sphere cells; Niantic uses them widely). Only geometry is
  // needed, so cells are keyed by (face, i, j) instead of Hilbert cell ids.
  function uvToST(u) { return u >= 0 ? 0.5 * Math.sqrt(1 + 3 * u) : 1 - 0.5 * Math.sqrt(1 - 3 * u); }
  function stToUV(s) { return s >= 0.5 ? (1 / 3) * (4 * s * s - 1) : (1 / 3) * (1 - 4 * (1 - s) * (1 - s)); }
  function latLngToFaceUV(lat, lon) {
    const phi = lat * DEG, th = lon * DEG, cp = Math.cos(phi);
    const x = cp * Math.cos(th), y = cp * Math.sin(th), z = Math.sin(phi);
    const ax = Math.abs(x), ay = Math.abs(y), az = Math.abs(z);
    let f;
    if (ax >= ay && ax >= az) f = x < 0 ? 3 : 0;
    else if (ay >= az) f = y < 0 ? 4 : 1;
    else f = z < 0 ? 5 : 2;
    let u, v;
    switch (f) {
      case 0: u = y / x; v = z / x; break;
      case 1: u = -x / y; v = z / y; break;
      case 2: u = -x / z; v = -y / z; break;
      case 3: u = z / x; v = y / x; break;
      case 4: u = z / y; v = -x / y; break;
      default: u = -y / z; v = -x / z;
    }
    return [f, u, v];
  }
  function faceUVToLatLng(f, u, v) {
    let x, y, z;
    switch (f) {
      case 0: x = 1; y = u; z = v; break;
      case 1: x = -u; y = 1; z = v; break;
      case 2: x = -u; y = -v; z = 1; break;
      case 3: x = -1; y = -v; z = -u; break;
      case 4: x = v; y = -1; z = -u; break;
      default: x = v; y = u; z = -1;
    }
    const lat = Math.atan2(z, Math.sqrt(x * x + y * y)) / DEG;
    const lon = Math.atan2(y, x) / DEG;
    return [lat, lon];
  }

  const GRID_LABELS = {
    's2-16': 'S2 level 16 (~150 m cells)',
    's2-17': 'S2 level 17 (~75 m cells)',
    's2-18': 'S2 level 18 (~38 m cells)',
    'll-0.00036': 'Lat/lng grid 0.00036° (~40 m, flower grid)',
    'll-0.00072': 'Lat/lng grid 0.00072° (~80 m)',
  };

  const gridCache = new Map();
  function getGrid(id) {
    if (gridCache.has(id)) return gridCache.get(id);
    let g;
    if (id.startsWith('s2-')) {
      const L = parseInt(id.slice(3), 10);
      const N = 2 ** L;
      const edge = 9.22e6 / N; // average edge in metres
      g = {
        id, label: GRID_LABELS[id] || id, edge, step: edge * 0.22,
        keyOf(lat, lon) {
          const [f, u, v] = latLngToFaceUV(lat, lon);
          let i = Math.floor(uvToST(u) * N), j = Math.floor(uvToST(v) * N);
          if (i >= N) i = N - 1; if (i < 0) i = 0;
          if (j >= N) j = N - 1; if (j < 0) j = 0;
          return (f * N + i) * N + j;
        },
        _geom: new Map(),
        cell(key) {
          let c = this._geom.get(key);
          if (c) return c;
          const j = key % N, rest = (key - j) / N, i = rest % N, f = (rest - i) / N;
          const pt = (s, t) => faceUVToLatLng(f, stToUV(s), stToUV(t));
          const s0 = i / N, s1 = (i + 1) / N, t0 = j / N, t1 = (j + 1) / N;
          const center = pt((i + 0.5) / N, (j + 0.5) / N);
          const corners = [pt(s0, t0), pt(s1, t0), pt(s1, t1), pt(s0, t1)];
          c = mkCell(key, center, corners);
          this._geom.set(key, c);
          return c;
        },
      };
    } else if (id.startsWith('ll-')) {
      const d = parseFloat(id.slice(3));
      const OFF_I = 600000, OFF_J = 1100000, W = 2300000;
      g = {
        id, label: GRID_LABELS[id] || id, edge: d * M_PER_DEG_LAT, step: d * M_PER_DEG_LAT * 0.3,
        keyOf(lat, lon) {
          return (Math.floor(lat / d) + OFF_I) * W + (Math.floor(lon / d) + OFF_J);
        },
        _geom: new Map(),
        cell(key) {
          let c = this._geom.get(key);
          if (c) return c;
          const jj = key % W, ii = (key - jj) / W;
          const i = ii - OFF_I, j = jj - OFF_J;
          const s = i * d, w = j * d, n = s + d, e = w + d;
          c = mkCell(key, [(s + n) / 2, (w + e) / 2], [[s, w], [s, e], [n, e], [n, w]]);
          this._geom.set(key, c);
          return c;
        },
      };
    } else {
      throw new Error('Unknown grid ' + id);
    }
    gridCache.set(id, g);
    return g;
  }
  function mkCell(key, center, corners) {
    let s = 90, n = -90, w = 180, e = -180;
    for (const [la, lo] of corners) {
      if (la < s) s = la; if (la > n) n = la; if (lo < w) w = lo; if (lo > e) e = lo;
    }
    return { key, lat: center[0], lon: center[1], corners, bbox: { s, w, n, e } };
  }
  /** All cell keys whose area intersects bbox (sampled lattice, robust across S2 faces). */
  function cellsInBBox(grid, b) {
    const keys = new Set();
    const midLat = (b.s + b.n) / 2;
    const dLat = grid.step / M_PER_DEG_LAT, dLon = grid.step / mPerDegLon(midLat);
    for (let la = b.s; la <= b.n + dLat; la += dLat) {
      const lat = Math.min(la, b.n);
      for (let lo = b.w; lo <= b.e + dLon; lo += dLon) keys.add(grid.keyOf(lat, Math.min(lo, b.e)));
    }
    return keys;
  }

  // ---------------------------------------------------------------------------
  // Polygon tests
  //   ray mode : complete geometry → even/odd ray cast (works on segment soup)
  //   ref mode : clipped geometry → parity along segment from a reference point
  //              whose inside/outside state Overpass told us (is_in)
  //   cover    : polygon encloses the whole tile
  // segs are flat arrays [lat1, lon1, lat2, lon2, ...]
  // ---------------------------------------------------------------------------
  function rayInside(segs, lat, lon) {
    let inside = false;
    for (let k = 0; k < segs.length; k += 4) {
      const y1 = segs[k], x1 = segs[k + 1], y2 = segs[k + 2], x2 = segs[k + 3];
      if ((y1 > lat) !== (y2 > lat)) {
        const xi = x1 + ((lat - y1) * (x2 - x1)) / (y2 - y1);
        if (xi > lon) inside = !inside;
      }
    }
    return inside;
  }
  function segCross(ay, ax, by, bx, cy, cx, dy, dx) {
    const d1 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx);
    const d2 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
    const d3 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
    const d4 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  }
  function refInsideTest(area, lat, lon) {
    const [ry, rx] = area.ref;
    let inside = area.refInside;
    const s = area.segs;
    for (let k = 0; k < s.length; k += 4) {
      if (segCross(ry, rx, lat, lon, s[k], s[k + 1], s[k + 2], s[k + 3])) inside = !inside;
    }
    return inside;
  }
  function segsBBox(segs) {
    let s = 90, n = -90, w = 180, e = -180;
    for (let k = 0; k < segs.length; k += 2) {
      const la = segs[k], lo = segs[k + 1];
      if (la < s) s = la; if (la > n) n = la; if (lo < w) w = lo; if (lo > e) e = lo;
    }
    return { s, w, n, e };
  }

  // ---------------------------------------------------------------------------
  // Overpass query + parse (one query per tile; all categories at once)
  // ---------------------------------------------------------------------------
  const TILE_DEG = 0.01;     // ~1.1 km tiles
  const TILE_PAD_DEG = 0.0025; // ~250 m of extra data around each tile
  const BIG_REL_M = 25000;   // relations longer than this come back clipped

  function tileKeyFor(lat, lon) { return Math.floor(lat / TILE_DEG) + '_' + Math.floor(lon / TILE_DEG); }
  function tileInfo(key) {
    const [a, b] = key.split('_').map(Number);
    const bbox = { s: a * TILE_DEG, w: b * TILE_DEG, n: (a + 1) * TILE_DEG, e: (b + 1) * TILE_DEG };
    const pbox = { s: bbox.s - TILE_PAD_DEG, w: bbox.w - TILE_PAD_DEG, n: bbox.n + TILE_PAD_DEG, e: bbox.e + TILE_PAD_DEG };
    return { key, bbox, pbox, center: [(bbox.s + bbox.n) / 2, (bbox.w + bbox.e) / 2] };
  }
  function tilesForBBox(b) {
    const keys = [];
    for (let a = Math.floor(b.s / TILE_DEG); a <= Math.floor(b.n / TILE_DEG); a++) {
      for (let c = Math.floor(b.w / TILE_DEG); c <= Math.floor(b.e / TILE_DEG); c++) keys.push(a + '_' + c);
    }
    return keys;
  }

  function groupTags(kinds, includeRegionJP) {
    const g = {};
    for (const c of CATEGORIES) {
      if (!kinds.includes(c.kind)) continue;
      if (c.region === 'JP' && !includeRegionJP) continue;
      for (const [k, v] of c.tags) (g[k] = g[k] || new Set()).add(v);
    }
    return g;
  }
  const esc = (s) => s.replace(/[\\"]/g, '\\$&');
  function sel(type, key, vals, bb) {
    const arr = [...vals];
    if (arr.length === 1) return `${type}["${key}"="${esc(arr[0])}"](${bb});`;
    return `${type}["${key}"~"^(${arr.map(esc).join('|')})$"](${bb});`;
  }

  /**
   * Build the Overpass QL for one tile. Output is split into sections, each
   * introduced by an `out count;` element, so the parser knows what follows.
   * variant: 'full' (length() split + is_in) | 'safe' (no length()) | 'minimal' (no is_in)
   */
  function buildQuery(tileKey, opts) {
    const o = Object.assign({ date: '', variant: 'full' }, opts || {});
    const t = tileInfo(tileKey);
    const p = t.pbox;
    const bb = [p.s, p.w, p.n, p.e].map((x) => x.toFixed(6)).join(',');
    const jp = inJapan(t.center[0], t.center[1]);
    const pointTags = groupTags(['point'], jp);
    const areaTags = groupTags(['area'], jp);
    const cuisines = [...new Set(CATEGORIES.flatMap((c) => c.cuisine))];
    const L = [];
    const dateClause = o.date ? `[date:"${esc(o.date)}T00:00:00Z"]` : '';
    L.push(`[out:json][timeout:90]${dateClause};`);
    const sections = [];
    // 1) points: POIs of point categories (any element, centre) + area categories as nodes
    L.push('(');
    for (const k of Object.keys(pointTags)) L.push(sel('nwr', k, pointTags[k], bb));
    for (const k of Object.keys(areaTags)) L.push(sel('node', k, areaTags[k], bb));
    L.push(`nwr["cuisine"~"${cuisines.join('|')}",i](${bb});`);
    L.push(')->.p;', '.p out count;', '.p out tags center qt;');
    sections.push('points');
    // 2) area ways, full geometry
    L.push('(');
    for (const k of Object.keys(areaTags)) L.push(sel('way', k, areaTags[k], bb));
    L.push(')->.aw;', '.aw out count;', '.aw out geom qt;');
    sections.push('areaWays');
    // 3) area relations — small ones full, big ones clipped to the tile
    L.push('(');
    for (const k of Object.keys(areaTags)) L.push(sel('relation', k, areaTags[k], bb));
    L.push(')->.ar;');
    if (o.variant === 'full') {
      L.push(`relation.ar(if:length()<${BIG_REL_M})->.rs;`, '(.ar; - .rs;)->.rb;');
      L.push('.rs out count;', '.rs out geom qt;');
      sections.push('relFull');
      L.push('.rb out count;', `.rb out geom(${bb}) qt;`);
      sections.push('relClipped');
    } else {
      L.push('.ar out count;', `.ar out geom(${bb}) qt;`);
      sections.push('relClipped');
    }
    // 4) bridges (lines, clipped)
    L.push(`way["bridge"="yes"](${bb})->.br;`, '.br out count;', `.br out tags geom(${bb}) qt;`);
    sections.push('bridges');
    // 5) which big areas contain the tile centre (reference for clipped relations)
    if (o.variant !== 'minimal' && !o.date) {
      const [cl, cn] = t.center.map((x) => x.toFixed(6));
      L.push(`is_in(${cl},${cn})->.ins;`, '(');
      for (const k of Object.keys(areaTags)) L.push(sel('area.ins', k, areaTags[k], '').replace('()', ''));
      L.push(')->.ia;', '.ia out count;', '.ia out tags;');
      sections.push('isIn');
    }
    return { query: L.join('\n'), sections, tile: t };
  }

  /** clipBox: for clipped output, drop segments with both ends outside the box —
   *  Overpass may omit the off-box nodes, which would otherwise create false chords. */
  function geomToSegs(geom, segs, clipBox) {
    if (!geom) return;
    for (let k = 1; k < geom.length; k++) {
      const a = geom[k - 1], b = geom[k];
      if (!a || !b || a.lat == null || b.lat == null) continue;
      if (clipBox && !bboxContains(clipBox, a.lat, a.lon) && !bboxContains(clipBox, b.lat, b.lon)) continue;
      segs.push(a.lat, a.lon, b.lat, b.lon);
    }
  }

  /** Turn an Overpass JSON response into a compact, cacheable tile record. */
  function parseTile(json, built) {
    const t = built.tile;
    const out = {
      key: t.key, bbox: t.bbox, pbox: t.pbox, center: t.center,
      points: [], areas: [], lines: [], covers: [], fetched: Date.now(),
    };
    if (!json || !Array.isArray(json.elements)) throw new Error('Unexpected Overpass response');
    if (json.remark && /error/i.test(json.remark)) throw new Error('Overpass: ' + json.remark);
    let si = -1;
    const insideIds = new Map(); // area id -> tags
    const seenAreaIds = new Set();
    const relClipped = [];
    for (const el of json.elements) {
      if (el.type === 'count') { si++; continue; }
      const section = built.sections[si];
      if (section === 'points') {
        const lat = el.lat != null ? el.lat : el.center && el.center.lat;
        const lon = el.lon != null ? el.lon : el.center && el.center.lon;
        if (lat == null) continue;
        out.points.push({ id: el.type[0] + el.id, et: el.type, lat, lon, tags: el.tags || {} });
      } else if (section === 'areaWays') {
        const segs = [];
        geomToSegs(el.geometry, segs);
        if (segs.length < 12) continue;
        // close the ring if Overpass returned an unclosed way
        const g = el.geometry, a = g[0], b = g[g.length - 1];
        if (a && b && (a.lat !== b.lat || a.lon !== b.lon)) segs.push(b.lat, b.lon, a.lat, a.lon);
        out.areas.push({ id: 'w' + el.id, et: 'way', mode: 'ray', tags: el.tags || {}, segs });
        seenAreaIds.add(2400000000 + el.id);
      } else if (section === 'relFull' || section === 'relClipped') {
        const segs = [];
        for (const m of el.members || []) if (m.type === 'way') geomToSegs(m.geometry, segs, section === 'relClipped' ? t.pbox : null);
        seenAreaIds.add(3600000000 + el.id);
        if (!segs.length) continue;
        const rec = { id: 'r' + el.id, et: 'relation', mode: section === 'relFull' ? 'ray' : 'ref', tags: el.tags || {}, segs };
        out.areas.push(rec);
        if (rec.mode === 'ref') relClipped.push([rec, el.id]);
      } else if (section === 'bridges') {
        const segs = [];
        geomToSegs(el.geometry, segs, t.pbox);
        if (segs.length) out.lines.push({ id: 'w' + el.id, et: 'way', tags: el.tags || {}, segs });
      } else if (section === 'isIn') {
        insideIds.set(el.id, el.tags || {});
      }
    }
    const hasIsIn = built.sections.includes('isIn');
    for (const [rec, id] of relClipped) {
      if (hasIsIn) {
        rec.ref = t.center;
        rec.refInside = insideIds.has(3600000000 + id);
      } else {
        rec.mode = 'ray'; // best effort without a reference point
      }
    }
    // areas that contain the whole tile but have no edges near it
    for (const [aid, tags] of insideIds) {
      if (seenAreaIds.has(aid)) continue;
      const id = aid >= 3600000000 ? 'r' + (aid - 3600000000) : 'w' + (aid - 2400000000);
      out.covers.push({ id, et: aid >= 3600000000 ? 'relation' : 'way', tags });
    }
    for (const a of out.areas) a.bbox = segsBBox(a.segs);
    for (const l of out.lines) l.bbox = segsBBox(l.segs);
    return out;
  }

  // ---------------------------------------------------------------------------
  // Feature store: merges cached tiles
  // ---------------------------------------------------------------------------
  class FeatureStore {
    constructor() { this.tiles = new Map(); this.version = 0; this._idx = null; }
    addTile(tile) { this.tiles.set(tile.key, tile); this.version++; this._idx = null; }
    has(key) { return this.tiles.has(key); }
    clear() { this.tiles.clear(); this.version++; this._idx = null; }
    tileAt(lat, lon) { return this.tiles.get(tileKeyFor(lat, lon)); }
    index() {
      if (this._idx) return this._idx;
      const points = new Map(), rayAreas = new Map(), lines = new Map();
      for (const t of this.tiles.values()) {
        for (const p of t.points) if (!points.has(p.id)) points.set(p.id, p);
        for (const a of t.areas) if (a.mode === 'ray' && !rayAreas.has(a.id)) rayAreas.set(a.id, a);
        for (const l of t.lines) lines.set(l.id + '@' + t.key, l);
      }
      // bucket points (~0.002° buckets)
      const B = 0.002, pb = new Map();
      for (const p of points.values()) {
        const k = Math.floor(p.lat / B) + ':' + Math.floor(p.lon / B);
        let arr = pb.get(k); if (!arr) pb.set(k, (arr = [])); arr.push(p);
      }
      this._idx = { points: [...points.values()], pointBuckets: pb, B, rayAreas: [...rayAreas.values()], lines: [...lines.values()] };
      return this._idx;
    }
    pointsIn(b) {
      const idx = this.index(), out = [], B = idx.B;
      for (let a = Math.floor(b.s / B); a <= Math.floor(b.n / B); a++) {
        for (let c = Math.floor(b.w / B); c <= Math.floor(b.e / B); c++) {
          const arr = idx.pointBuckets.get(a + ':' + c);
          if (arr) for (const p of arr) if (bboxContains(b, p.lat, p.lon)) out.push(p);
        }
      }
      return out;
    }
    /** Area features (with categories already resolved) containing the point. */
    areasAt(lat, lon, catsOf) {
      const res = [];
      for (const a of this.index().rayAreas) {
        if (!bboxContains(a.bbox, lat, lon)) continue;
        if (!catsOf(a).length) continue;
        if (rayInside(a.segs, lat, lon)) res.push(a);
      }
      const t = this.tileAt(lat, lon);
      if (t) {
        for (const a of t.areas) {
          if (a.mode !== 'ref' || !catsOf(a).length) continue;
          if (refInsideTest(a, lat, lon)) res.push(a);
        }
        for (const c of t.covers) if (catsOf(c).length) res.push(c);
      }
      return res;
    }
  }

  // ---------------------------------------------------------------------------
  // Cell index: which decor categories each cell carries
  // ---------------------------------------------------------------------------
  function featureName(f) {
    const t = f.tags || {};
    return t.name || t['name:en'] || t.brand || t.operator || t['bridge:name'] || '';
  }

  /**
   * Build typed cells covering bbox for the given options.
   * Returns { grid, cells: Map(key → {key,lat,lon,corners,cats:[],src:[{cat,name,id}]}), lookup }
   */
  function buildCellIndex(store, bbox, opts) {
    opts = Object.assign({}, DEFAULT_OPTS, opts || {});
    const grid = getGrid(opts.grid);
    const typed = new Map();
    const catCache = new Map();
    const catsOf = (f, role) => {
      const ck = f.id + '|' + role;
      let r = catCache.get(ck);
      if (!r) {
        const la = f.lat != null ? f.lat : (f.bbox ? (f.bbox.s + f.bbox.n) / 2 : 0);
        const lo = f.lon != null ? f.lon : (f.bbox ? (f.bbox.w + f.bbox.e) / 2 : 0);
        r = catsFor(f.tags, f.et, role, opts, la, lo);
        catCache.set(ck, r);
      }
      return r;
    };
    const add = (key, cats, f) => {
      let c = typed.get(key);
      if (!c) {
        const g = grid.cell(key);
        c = { key, lat: g.lat, lon: g.lon, corners: g.corners, bbox: g.bbox, cats: [], src: [] };
        typed.set(key, c);
      }
      for (const id of cats) {
        if (!c.cats.includes(id)) c.cats.push(id);
        if (c.src.length < 40) c.src.push({ cat: id, name: featureName(f), id: f.id });
      }
    };
    const frame = expandBBox(bbox, grid.edge);
    // points
    for (const p of store.pointsIn(frame)) {
      const cats = catsOf(p, 'point');
      if (cats.length) add(grid.keyOf(p.lat, p.lon), cats, p);
    }
    // lines (bridges): sample along each segment
    if (opts.bridgeMode !== 'off') {
      const stepDeg = grid.step / M_PER_DEG_LAT;
      for (const l of store.index().lines) {
        if (!bboxOverlap(l.bbox, frame)) continue;
        const cats = catsOf(l, 'line');
        if (!cats.length) continue;
        const s = l.segs;
        for (let k = 0; k < s.length; k += 4) {
          const len = Math.hypot(s[k + 2] - s[k], s[k + 3] - s[k + 1]);
          const n = Math.max(1, Math.ceil(len / stepDeg));
          for (let q = 0; q <= n; q++) {
            const la = s[k] + ((s[k + 2] - s[k]) * q) / n, lo = s[k + 1] + ((s[k + 3] - s[k + 1]) * q) / n;
            if (bboxContains(frame, la, lo)) add(grid.keyOf(la, lo), cats, l);
          }
        }
      }
    }
    // areas: test every cell in the frame
    const areaCats = (a) => catsOf(a, 'area');
    const keys = cellsInBBox(grid, frame);
    for (const key of keys) {
      const g = grid.cell(key);
      const probes = opts.areaRule === 'overlap'
        ? [[g.lat, g.lon], ...g.corners, ...g.corners.map((p, i) => {
          const q = g.corners[(i + 1) % 4]; return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
        })]
        : [[g.lat, g.lon]];
      const hit = new Map();
      for (const [la, lo] of probes) {
        for (const a of store.areasAt(la, lo, areaCats)) hit.set(a.id, a);
      }
      if (opts.areaRule === 'overlap') {
        // small polygons entirely inside the cell
        for (const a of store.index().rayAreas) {
          if (hit.has(a.id) || !bboxOverlap(a.bbox, g.bbox) || !areaCats(a).length) continue;
          if (grid.keyOf(a.segs[0], a.segs[1]) === key) hit.set(a.id, a);
        }
      }
      for (const a of hit.values()) add(key, areaCats(a), a);
    }
    // spatial lookup for detector queries
    const lookup = makeLookup(typed, (bbox.s + bbox.n) / 2, opts.radius);
    return { grid, opts, bbox, cells: typed, lookup };
  }

  function makeLookup(typed, lat0, radius) {
    const dLat = radius / M_PER_DEG_LAT, dLon = radius / mPerDegLon(lat0);
    const buckets = new Map();
    for (const c of typed.values()) {
      if (!c.cats.length) continue;
      const k = Math.floor(c.lat / dLat) + ':' + Math.floor(c.lon / dLon);
      let arr = buckets.get(k); if (!arr) buckets.set(k, (arr = [])); arr.push(c);
    }
    return {
      dLat, dLon,
      near(lat, lon) {
        const a = Math.floor(lat / dLat), b = Math.floor(lon / dLon), res = [];
        for (let i = a - 1; i <= a + 1; i++) for (let j = b - 1; j <= b + 1; j++) {
          const arr = buckets.get(i + ':' + j); if (arr) for (const c of arr) res.push(c);
        }
        return res;
      },
    };
  }

  // ---------------------------------------------------------------------------
  // Detector simulation
  // ---------------------------------------------------------------------------
  /** Predict the detector list at (lat, lon). */
  function detect(cellIndex, lat, lon) {
    const { radius, maxShown } = cellIndex.opts;
    const inRange = [];
    for (const c of cellIndex.lookup.near(lat, lon)) {
      const d = distM(lat, lon, c.lat, c.lon);
      if (d <= radius) inRange.push({ cell: c, d });
    }
    inRange.sort((a, b) => a.d - b.d);
    const order = [], counts = {};
    for (const { cell } of inRange) {
      for (const id of cell.cats) {
        counts[id] = (counts[id] || 0) + 1;
        if (!order.includes(id)) order.push(id);
      }
    }
    const shown = order.slice(0, maxShown);
    const hidden = order.slice(maxShown);
    return { inRange, shown, hidden, counts, roadside: shown.length === 0 };
  }

  /**
   * Isolation raster for a target category over bbox.
   * val[k]: -1 target not detectable; otherwise number of OTHER types shown.
   */
  function isolationGrid(cellIndex, bbox, target, maxSamples) {
    maxSamples = maxSamples || 90000;
    const { radius, maxShown } = cellIndex.opts;
    const midLat = (bbox.s + bbox.n) / 2;
    const wM = (bbox.e - bbox.w) * mPerDegLon(midLat), hM = (bbox.n - bbox.s) * M_PER_DEG_LAT;
    const step = Math.max(3, Math.sqrt((wM * hM) / maxSamples));
    const cols = Math.max(1, Math.ceil(wM / step)), rows = Math.max(1, Math.ceil(hM / step));
    const dLat = (bbox.n - bbox.s) / rows, dLon = (bbox.e - bbox.w) / cols;
    const val = new Int8Array(cols * rows), tcount = new Uint8Array(cols * rows);
    const r2 = radius * radius;
    const ky = M_PER_DEG_LAT, kx = mPerDegLon(midLat);
    for (let r = 0; r < rows; r++) {
      const lat = bbox.n - (r + 0.5) * dLat;   // row 0 = north
      for (let c = 0; c < cols; c++) {
        const lon = bbox.w + (c + 0.5) * dLon;
        const near = cellIndex.lookup.near(lat, lon);
        let list = null, union = 0, tc = 0, hasT = false;
        const seen = new Set();
        for (const cell of near) {
          const dy = (cell.lat - lat) * ky, dx = (cell.lon - lon) * kx;
          const d2 = dx * dx + dy * dy;
          if (d2 > r2) continue;
          (list || (list = [])).push([d2, cell]);

    d.shown.forEach((id) => { out += `<div class="dt ${id === t ? 't' : ''}"><span>${E.CAT[id].icon}</span><span>${html(E.CAT[id].name)}</span></div>`; });
    d.hidden.forEach((id) => { out += `<div class="dt hid" title="Beyond the ${state.opts.maxShown}-icon limit"><span>${E.CAT[id].icon}</span><span>${html(E.CAT[id].name)}</span></div>`; });
    out += '</div>';
    if (d.hidden.length) out += `<p class="muted small">Faded icons are further away than the ${state.opts.maxShown} nearest types, so they probably won't show.</p>`;
    if (d.inRange.length) {
      out += `<details><summary>Why? ${d.inRange.length} cell${d.inRange.length === 1 ? '' : 's'} in range</summary><table><tr><th>Dist.</th><th>Decor · source</th></tr>`;
      for (const { cell, d: dist } of d.inRange) {
        const seen = new Set();
        const src = cell.src.filter((s) => { const k = s.cat + s.name; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 6)
          .map((s) => `${E.CAT[s.cat].icon} ${html(s.name || E.CAT[s.cat].name)} <a class="small" href="https://www.openstreetmap.org/${{ n: 'node', w: 'way', r: 'relation' }[s.id[0]]}/${s.id.slice(1)}" target="_blank" rel="noopener">osm</a>`).join('<br>');
        out += `<tr><td>${Math.round(dist)} m</td><td>${src}</td></tr>`;
      }
      out += '</table></details>';
    }
    out += `<div class="row" style="margin-top:10px"><button class="btn sm" id="logHere">Log a real detector reading here</button>
      <button class="btn sm" id="clearProbe">Clear</button></div>`;
    el.innerHTML = out;
    $('#logHere').onclick = () => { state.cal.lat = p.lat; state.cal.lon = p.lon; state.cal.src = state.live ? 'gps' : 'map'; showTab('calibrate'); };
    $('#clearProbe').onclick = () => { state.probe = null; state.probeDet = null; renderDetector(); renderLegend(); map.redraw(); };
  }

  // ---- calibration ----
  function renderCalibrate() {
    const el = $('#p-calibrate');
    const c = state.cal;
    const all = [...E.CATEGORIES.map((x) => x.id), 'roadside'];
    let out = `<h3>Log a real detector reading</h3>
      <p class="muted small">Stand still, open the detector and wait for the icons. Then tap the map where you are (or use GPS), tick exactly the icons the game showed, and save. A few readings in varied places let the tool test which cell model matches the game.</p>
      <div class="row" style="margin-bottom:8px"><button class="btn sm" id="calGps">📍 Use my GPS</button>
      <span class="muted small">${c.lat != null ? `Location: ${c.lat.toFixed(5)}, ${c.lon.toFixed(5)} (${c.src === 'gps' ? 'GPS' : 'map tap'})` : 'Tap the map to set the location'}</span></div>
      <input id="calFilter" placeholder="Filter icons…" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px">
      <div class="chips" id="calChips">${all.map((id) => `<button class="chip ${c.sel.has(id) ? 'on' : ''}" data-id="${id}">${html(catLabel(id))}</button>`).join('')}</div>
      <input id="calNote" placeholder="Note (optional), e.g. 'icons appeared after 3 s'" value="${html(c.note)}" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-top:8px">
      <div class="row" style="margin-top:8px"><button class="btn primary" id="calSave" ${c.lat == null || !c.sel.size ? 'disabled' : ''}>Save reading</button>
      <span class="muted small">${c.sel.size} selected</span></div>`;
    out += `<h3 style="margin-top:16px">Readings (${state.readings.length})</h3>`;
    if (state.readings.length) {
      out += '<table>' + state.readings.slice().reverse().map((r) => `<tr><td class="small">${new Date(r.t).toLocaleDateString()}<br>${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</td><td class="icons">${r.observed.map((id) => id === 'roadside' ? E.ROADSIDE.icon : (E.CAT[id] ? E.CAT[id].icon : '?')).join(' ')}</td><td><button class="btn sm" data-show="${r.id}">Show</button> <button class="btn sm" data-del="${r.id}">✕</button></td></tr>`).join('') + '</table>';
      out += `<div class="row" style="margin-top:10px"><button class="btn primary" id="calTest">Test cell models against my readings</button></div>`;
    }
    if (state.calResults) out += calResultsHtml();
    out += `<details><summary>Export / import readings</summary>
      <p class="muted small">Export to back up your readings or send them to whoever is tuning the tool.</p>
      <textarea id="calExport" readonly>${html(exportJson())}</textarea>
      <div class="row"><button class="btn sm" id="calCopy">Copy</button><a class="btn sm" id="calDl" download="pikmin-decor-readings.json">Download</a></div>
      <p class="muted small" style="margin-top:10px">Import (paste exported JSON):</p>
      <textarea id="calImport" placeholder='{"readings":[…]}'></textarea>
      <button class="btn sm" id="calImportBtn">Import</button></details>`;
    el.innerHTML = out;
    const filt = $('#calFilter');
    filt.oninput = () => { const q = filt.value.toLowerCase(); el.querySelectorAll('#calChips .chip').forEach((b) => { b.style.display = b.textContent.toLowerCase().includes(q) ? '' : 'none'; }); };
    el.querySelectorAll('#calChips .chip').forEach((b) => b.onclick = () => {
      const id = b.dataset.id;
      if (c.sel.has(id)) c.sel.delete(id); else {
        if (id === 'roadside') c.sel.clear(); else c.sel.delete('roadside');
        c.sel.add(id);
      }
      c.note = $('#calNote').value; renderCalibrate();
    });
    $('#calNote').oninput = (e) => { c.note = e.target.value; };
    $('#calGps').onclick = () => locate((pos) => { c.lat = pos.lat; c.lon = pos.lon; c.src = 'gps'; c.acc = pos.acc; setProbe(pos.lat, pos.lon, false); frame(pos.lat, pos.lon, Math.max(map.zoom, 17)); renderCalibrate(); });
    $('#calSave').onclick = () => {
      state.readings.push({ id: Date.now(), t: new Date().toISOString(), lat: +c.lat.toFixed(7), lon: +c.lon.toFixed(7), src: c.src, acc: c.acc || null, observed: [...c.sel], note: c.note || '' });
      c.sel = new Set(); c.note = ''; state.calResults = null; persist(); toast('Reading saved'); renderCalibrate();
    };
    el.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { state.readings = state.readings.filter((r) => String(r.id) !== b.dataset.del); state.calResults = null; persist(); renderCalibrate(); });
    el.querySelectorAll('[data-show]').forEach((b) => b.onclick = () => { const r = state.readings.find((x) => String(x.id) === b.dataset.show); frame(r.lat, r.lon, 17.5); setProbe(r.lat, r.lon, false); });
    const t = $('#calTest'); if (t) t.onclick = testModels;
    $('#calCopy').onclick = () => copyText($('#calExport').value);
    try { $('#calDl').href = URL.createObjectURL(new Blob([exportJson()], { type: 'application/json' })); } catch (e) { /* */ }
    $('#calImportBtn').onclick = () => {
      try {
        const data = JSON.parse($('#calImport').value);
        const arr = Array.isArray(data) ? data : data.readings;
        let added = 0;
        for (const r of arr || []) {
          if (typeof r.lat !== 'number' || !Array.isArray(r.observed)) continue;
          if (!r.id) r.id = Date.now() + added;
          if (state.readings.some((x) => x.id === r.id)) continue;
          state.readings.push(r); added++;
        }
        persist(); state.calResults = null; toast(`Imported ${added} reading${added === 1 ? '' : 's'}`); renderCalibrate();
      } catch (e) { toast('Could not read that JSON'); }
    };
    el.querySelectorAll('[data-use]').forEach((b) => b.onclick = () => {
      const r = state.calResults.list[+b.dataset.use];
      Object.assign(state.opts, { grid: r.opts.grid, areaRule: r.opts.areaRule, cuisineMode: r.opts.cuisineMode, bridgeMode: r.opts.bridgeMode });
      toast('Model applied'); lastIndexKey = ''; state.calResults = null; renderSettings(); renderCalibrate(); analyze();
    });
  }
  function exportJson() {
    return JSON.stringify({ app: 'pikmin-decor-finder', version: APP_VERSION, exported: new Date().toISOString(), model: state.opts, osmDate: state.settings.date || 'live', readings: state.readings }, null, 1);
  }
  async function testModels() {
    const btn = $('#calTest'); btn.disabled = true; btn.textContent = 'Loading map data…';
    const keys = new Set();
    for (const r of state.readings) {
      const b = E.expandBBox({ s: r.lat, n: r.lat, w: r.lon, e: r.lon }, state.opts.radius + 200);
      E.tilesForBBox(b).forEach((k) => keys.add(k));
    }
    const errs = await ensureTiles([...keys], (d, t) => { btn.textContent = `Loading map data… ${d}/${t}`; });
    btn.textContent = 'Testing models…';
    await new Promise((r) => setTimeout(r, 30));
    const list = E.evaluateModels(state.store, state.readings, E.modelVariants(state.opts));
    const curKey = JSON.stringify([state.opts.grid, state.opts.areaRule, state.opts.cuisineMode, state.opts.bridgeMode]);
    const current = list.find((r) => JSON.stringify([r.opts.grid, r.opts.areaRule, r.opts.cuisineMode, r.opts.bridgeMode]) === curKey);
    state.calResults = { list, current, errs: errs.length };
    renderCalibrate();
  }
  function calResultsHtml() {
    const { list, current, errs } = state.calResults;
    const top = list.slice(0, 8);
    let out = `<h3 style="margin-top:14px">Model fit</h3>
      <p class="muted small">Score = average overlap between predicted and observed icons (100% = identical). Exact = readings matched perfectly.${errs ? ` ⚠️ ${errs} map area(s) failed to load.` : ''}</p>
      <table><tr><th>Score</th><th>Exact</th><th>Model</th><th></th></tr>`;
    top.forEach((r, i) => {
      out += `<tr><td><b>${Math.round(r.score * 100)}%</b></td><td>${r.exact}/${r.n}</td><td class="small">${html(r.label)}</td><td><button class="btn sm" data-use="${i}">Use</button></td></tr>`;
    });
    out += '</table>';
    if (current) {
      out += `<p class="small">Current model: <b>${Math.round(current.score * 100)}%</b> (${current.exact}/${current.n} exact)</p>`;
      const bad = current.details.filter((d) => d.missing.length || d.extra.length);
      if (bad.length) {
        out += `<details><summary>Mismatches with the current model (${bad.length})</summary><table>`;
        for (const d of bad) {
          const r = state.readings.find((x) => x.id === d.id);
          out += `<tr><td class="small">${r ? r.lat.toFixed(4) + ', ' + r.lon.toFixed(4) : ''}</td><td class="small">${d.missing.length ? 'Game showed, tool missed: ' + d.missing.map(catLabel).join(', ') + '<br>' : ''}${d.extra.length ? 'Tool predicted, game didn\'t: ' + d.extra.map(catLabel).join(', ') : ''}</td></tr>`;
        }
        out += '</table><p class="muted small">"Game showed, tool missed" often means the game has a place (from Foursquare or older OSM data) that today\'s OSM lacks. "Tool predicted" can mean the place was added to OSM after the game\'s last map update.</p></details>';
      }
    }
    return out;
  }

    el.innerHTML = `<h3>Cell model</h3>
      <div class="kv">

    const on = (id, fn) => { $(id).onchange = fn; };

  function renderHelp() {
    $('#p-help').innerHTML = `<h3>How it works</h3>

      <p class="small">This tool downloads OpenStreetMap places for the area (one combined query per ~1 km tile, cached on your device). It works out each cell's decor types, then tests every point on the map to see which types the detector would list there.</p>
      <h3>Colours</h3>
      <p class="small"><b style="color:${LEVEL_COLORS[0]}">Green</b>: only your decor type in range. <b style="color:#a16207">Yellow</b>/<b style="color:${LEVEL_COLORS[2]}">orange</b>/<b style="color:${LEVEL_COLORS[3]}">red</b>: 1/2/3+ other types too. Uncoloured: your type is out of range. Cells with your type are outlined green; other decor cells are grey.</p>
      <h3>Tips in the game</h3>
      <ul class="small">
        <li>The detector's icon list stays fixed until you move <b>25 m</b> from where it last scanned. Open the detector only once you're standing in the green zone. If the icons look stale, walk 25 m away and come back.</li>
        <li>Check the icons the game shows before using the detector. If only your type appears, you're set.</li>
        <li>Choose spots with a big safe zone so GPS drift doesn't push you out.</li>
      </ul>
      <h3>Limits</h3>
      <ul class="small">
        <li>The game also uses Foursquare and maybe other sources, so some decor places aren't in OSM. The game also updates its map copy only occasionally (most recently October 2026).</li>
        <li>The cell grid and the polygon rules aren't published. Use <b>Calibrate</b> to log real detector readings and test which model matches.</li>
        <li>Weather and event decor don't depend on location and aren't covered.</li>
      </ul>
      <p class="muted small">Data © OpenStreetMap contributors (ODbL), via the Overpass API. Tag mapping from Pikipedia's Decor Pikmin page. Unofficial fan tool; not affiliated with Niantic or Nintendo.</p>`;

  // ---- picker ----
  function openPicker() {
    $('#picker').classList.add('on');
    const s = $('#pickSearch'); s.value = ''; renderPicker(''); setTimeout(() => s.focus(), 50);
  }
  function renderPicker(q) {
    const counts = new Map();
    if (state.index) for (const c of state.index.cells.values()) for (const id of c.cats) counts.set(id, (counts.get(id) || 0) + 1);
    q = q.toLowerCase();
    const items = E.CATEGORIES.filter((c) => !q || c.name.toLowerCase().includes(q) || c.tags.some(([k, v]) => (k + '=' + v).includes(q)) || c.cuisine.some((x) => x.includes(q)))
      .slice().sort((a, b) => (counts.get(b.id) || 0) - (counts.get(a.id) || 0) || a.index - b.index);
    $('#pickList').innerHTML = (state.target ? `<button class="pi" data-id=""><span class="ico">🗺️</span><span>Explore all (no target)</span></button>` : '') +
      items.map((c) => `<button class="pi ${c.id === state.target ? 'on' : ''}" data-id="${c.id}"><span class="ico">${c.icon}</span><span>${html(c.name)}<br><span class="muted small">${html([...c.tags.map((t) => t.join('=')), ...(c.cuisine.length ? ['cuisine=' + c.cuisine.join('/')] : [])].join(', '))}</span></span>
        <span class="cnt">${counts.get(c.id) ? `<b>${counts.get(c.id)}</b> in view` : ''}</span></button>`).join('');
    $('#pickList').querySelectorAll('.pi').forEach((b) => b.onclick = () => { $('#picker').classList.remove('on'); setTarget(b.dataset.id || null); });
  }
  function setTarget(id) {
    state.target = id;
    runTarget(); persist(); renderAll(); map.redraw(); showTab('spots');
    if (map.zoom < MIN_LOAD_ZOOM) toast('Zoom in to search');
    analyze();
  }

  // ---- tabs + sheet ----
  function showTab(name) {
    state.tab = name;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
    document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === 'p-' + name));
    if (name === 'calibrate') renderCalibrate();
    if (name === 'settings') renderSettings();
    if (innerWidth < 900 && sheetFrac < 0.3) setSheet(0.42);
  }
  let sheetFrac = 0.42;
  function setSheet(f) {
    sheetFrac = Math.max(0.12, Math.min(0.88, f));
    document.documentElement.style.setProperty('--sheet-h', (sheetFrac * 100).toFixed(1) + 'vh');
    placeAttr();
  }
  (function bindGrab() {
    const g = $('#grab'); let start = null;
    g.addEventListener('pointerdown', (e) => { g.setPointerCapture(e.pointerId); start = { y: e.clientY, f: sheetFrac, moved: false }; });
    g.addEventListener('pointermove', (e) => { if (!start) return; const dy = e.clientY - start.y; if (Math.abs(dy) > 4) start.moved = true; setSheet(start.f - dy / innerHeight); });
    g.addEventListener('pointerup', () => { if (start && !start.moved) setSheet(sheetFrac > 0.3 ? 0.14 : 0.42); start = null; });
  })();

  // ---- geolocation ----
  function locate(cb) {
    if (!navigator.geolocation) { toast('Location is not available in this browser'); return; }
    navigator.geolocation.getCurrentPosition((p) => {
      const pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
      state.me = pos; cb(pos); map.redraw();
    }, (err) => toast('Location error: ' + err.message), { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
  }
  let watchId = null;
  function toggleLive() {
    state.live = !state.live;
    $('#btnLive').classList.toggle('on', state.live);
    if (!state.live) { if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; toast('Live detector off'); return; }
    if (!navigator.geolocation) { toast('Location is not available'); state.live = false; $('#btnLive').classList.remove('on'); return; }
    toast('Live detector on: following your GPS');
    let first = true;
    watchId = navigator.geolocation.watchPosition((p) => {
      state.me = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
      const sx = map.toScreen(state.me.lat, state.me.lon);
      if (first || sx[0] < map.w * 0.2 || sx[0] > map.w * 0.8 || sx[1] < map.h * 0.15 || sx[1] > map.h * 0.6) {
        map.setView(state.me.lat, state.me.lon, first ? Math.max(map.zoom, 17) : null);
        first = false;
      }
      setProbe(state.me.lat, state.me.lon, false).then(() => {
        const d = state.probeDet;
        if (d && state.target) {
          const only = d.shown.length === 1 && d.shown[0] === state.target;
          setStatus(only ? `✅ Here: only ${E.CAT[state.target].icon} ${html(E.CAT[state.target].name)}` : `Here: ${d.roadside ? E.ROADSIDE.icon : d.shown.map((id) => E.CAT[id].icon).join(' ')}`);
        }
      });
    }, (err) => toast('Location error: ' + err.message), { enableHighAccuracy: true, maximumAge: 2000 });
  }

  function copyText(t) {
    const done = () => toast('Copied');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallback());
    else fallback();
    function fallback() {
      const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed: select and copy manually'); }
      ta.remove();
    }
  }

  // Wire up
  // --------------------------------------------------------------------------
  $('#pick').onclick = openPicker;
  $('#pickClose').onclick = () => $('#picker').classList.remove('on');
  $('#picker').onclick = (e) => { if (e.target.id === 'picker') $('#picker').classList.remove('on'); };
  $('#pickSearch').oninput = (e) => renderPicker(e.target.value);
  document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => showTab(b.dataset.tab));
  $('#btnLocate').onclick = () => locate((pos) => { frame(pos.lat, pos.lon, Math.max(map.zoom, 16.5)); });
  $('#btnLive').onclick = toggleLive;
  $('#btnCells').classList.toggle('on', state.settings.showCells);
  $('#btnHeat').classList.toggle('on', state.settings.showHeat);
  $('#btnCells').onclick = () => { state.settings.showCells = !state.settings.showCells; $('#btnCells').classList.toggle('on', state.settings.showCells); persist(); map.redraw(); };
  $('#btnHeat').onclick = () => { state.settings.showHeat = !state.settings.showHeat; $('#btnHeat').classList.toggle('on', state.settings.showHeat); persist(); renderLegend(); map.redraw(); };
  addEventListener('resize', placeAttr);

  setSheet(innerWidth < 900 ? 0.42 : 0.42);
  renderHelp(); renderSettings(); renderAll();
  if (!saved.view) toast('Tap ◎ to jump to your location', 4000);
  analyze();
  window.PBApp = { state, map, analyze, setTarget, setProbe };
})();

</script>
</body>
</html>
